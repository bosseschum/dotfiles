"$schema" = 'https://starship.rs/config-schema.json'

format = """
[ ](rose)\
$os\
$username\
[](bg:pine fg:rose)\
$directory\
[](fg:pine bg:gold)\
$git_branch\
$git_status\
[](fg:gold bg:love)\
$ruby\
$nodejs\
$php\
$python\
[](fg:love bg:foam)\
$package\
$docker_context\
$terraform\
$aws\
[](fg:foam)\
$line_break\
$line_break\
$character"""

palette = 'rose-pine-moon'

[palettes.rose-pine]
base = '#191724'
surface = '#1f1d2e'
overlay = '#26233a'
muted = '#6e6a86'
subtle = '#908caa'
text = '#e0def4'
love = '#eb6f92'
gold = '#f6c177'
rose = '#ebbcba'
pine = '#31748f'
foam = '#9ccfd8'
iris = '#c4a7e7'
highlight_low = '#21202e'
highlight_med = '#403d52'
highlight_high = '#524f67'

[palettes.rose-pine-moon]
base = '#232136'
surface = '#2a273f'
overlay = '#393552'
muted = '#6e6a86'
subtle = '#908caa'
text = '#e0def4'
love = '#eb6f92'
gold = '#f6c177'
rose = '#ea9a97'
pine = '#3e8fb0'
foam = '#9ccfd8'
iris = '#c4a7e7'
highlight_low = '#2a283e'
highlight_med = '#44415a'
highlight_high = '#56526e'

[palettes.rose-pine-dawn]
base = '#faf4ed'
surface = '#fffaf3'
overlay = '#f2e9e1'
muted = '#9893a5'
subtle = '#797593'
text = '#575279'
love = '#b4637a'
gold = '#ea9d34'
rose = '#d7827e'
pine = '#286983'
foam = '#56949f'
iris = '#907aa9'
highlight_low = '#f4ede8'
highlight_med = '#dfdad9'
highlight_high = '#cecacd'

[os]
disabled = false
style = "bg:rose fg:overlay"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:rose fg:overlay"
style_root = "bg:rose fg:overlay"
format = '[ $user% ]($style)'

[directory]
style = "fg:text bg:pine"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = "󰇚"
"Music" = "󰝚 "
"Pictures" = ""
"Developer" = "󰲋 "
"app" = ""
"api" = "󰿘 "

[git_branch]
symbol = ""
style = "bg:gold"
format = '[[ $symbol $branch ](fg:overlay bg:gold)]($style)'

[git_status]
style = "bg:gold"
format = '[[($all_status$ahead_behind )](fg:overlay bg:gold)]($style)'

# ── Web Languages ──────────────────────────────────────────────────────────────

[ruby]
symbol = "󰴭"
style = "bg:overlay"
format = '[[ $symbol( $version) ](fg:overlay bg:love)]($style)'

[nodejs]
symbol = ""
style = "bg:foam"
format = '[[ $symbol( $version) ](fg:overlay bg:foam)]($style)'

[php]
symbol = ""
style = "bg:foam"
format = '[[ $symbol( $version) ](fg:overlay bg:foam)]($style)'

[python]
symbol = "󰌠"
style = "bg:pine"
format = '[[ $symbol( $version) ](fg:overlay bg:pine)]($style)'

# ── Package version (Gemfile, package.json, composer.json, etc.) ───────────────

[package]
symbol = "󰏗 "
style = "bg:foam"
format = '[[ $symbol$version ](fg:overlay bg:foam)]($style)'
display_private = false

# ── Infrastructure ─────────────────────────────────────────────────────────────

[docker_context]
symbol = ""
style = "bg:iris"
format = '[[ $symbol( $context) ](fg:text bg:iris)]($style)'
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

[terraform]
symbol = "󱁢 "
style = "bg:iris"
format = '[[ $symbol$workspace ](fg:text bg:iris)]($style)'

[aws]
symbol = "󰸏 "
style = "bg:iris"
format = '[[ $symbol($profile)(\($region\)) ](fg:text bg:iris)]($style)'
# Only show when AWS_PROFILE or AWS_DEFAULT_PROFILE is set to avoid noise
disabled = false

[time]
disabled = false
time_format = "%R"
style = "bg:overlay"
format = '[[  $time ](fg:text bg:overlay)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[ ](bold fg:pine)'
error_symbol = '[ ](bold fg:love)'
vimcmd_symbol = '[ ](bold fg:gold)'
vimcmd_replace_one_symbol = '[ ](bold fg:iris)'
vimcmd_replace_symbol = '[ ](bold fg:iris)'
vimcmd_visual_symbol = '[ ](bold fg:foam)'
